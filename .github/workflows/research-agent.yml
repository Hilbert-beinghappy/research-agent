name: Research Agent

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v3-beta-core:
    name: v3.0.0-beta.1 technical core (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Setup R
        if: runner.os != 'Windows'
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Install Linux process sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build research-agent contracts
        run: npm run build -w packages/research-agent-contracts

      - name: Record release identity
        run: npm run report:release-identity -w packages/research-agent -- --require-clean --output ../../research-agent-release-identity.json

      - name: Qualify current upstream replay
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        run: |
          upstream_ref=refs/doro-upstream-replay/pi-97f0ccdd96cc207b6ad3630c56eea4d32dbdcf53
          git update-ref -d "$upstream_ref"
          fetch_status=0
          git fetch --no-tags --depth=1 https://github.com/earendil-works/pi.git "97f0ccdd96cc207b6ad3630c56eea4d32dbdcf53:$upstream_ref" || fetch_status=$?
          replay_status=0
          node packages/research-agent/scripts/qualify-upstream-replay.ts --upstream-ref "$upstream_ref" --output research-agent-upstream-replay.json || replay_status=$?
          if [ "$fetch_status" -ne 0 ]; then exit "$fetch_status"; fi
          exit "$replay_status"

      - name: Upload upstream replay qualification
        if: always() && runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-agent-upstream-replay-${{ github.sha }}
          path: research-agent-upstream-replay.json
          if-no-files-found: error

      - name: Hydrate Pi model data
        run: npm run hydrate:model-data

      - name: Check package
        run: |
          npm run check -w packages/research-agent-contracts
          npm run check -w packages/research-agent

      - name: Run deterministic tests
        run: |
          npm test -w packages/research-agent-contracts
          npm run test:unit -w packages/research-agent
          npm run test:integration -w packages/research-agent
          npm run test:e2e -w packages/research-agent
          npm run test:compat -w packages/research-agent

      - name: Replay v0.1 through v3 technical gates
        run: |
          npm run eval -w packages/research-agent -- v0.1
          npm run eval:v0.2 -w packages/research-agent -- v0.2
          npm run eval:v0.3 -w packages/research-agent -- v0.3
          npm run eval:v0.4 -w packages/research-agent -- v0.4
          npm run eval:v0.5 -w packages/research-agent -- v0.5
          npm run eval:v1.0 -w packages/research-agent -- v1.0
          npm run eval:v1.1 -w packages/research-agent -- v1.1
          npm run eval:v1.5 -w packages/research-agent -- v1.5
          npm run eval:v2.0 -w packages/research-agent -- v2.0
          npm run eval:memory:v3 -w packages/research-agent

      - name: Qualify Personal Memory scale
        run: |
          node packages/research-agent/scripts/qualify-memory-store.ts --output research-agent-memory-store-v3.json
          node packages/research-agent/scripts/qualify-memory-retrieval.ts --output research-agent-memory-retrieval-v3.json

      - name: Qualify v3 beta technical boundary
        run: npm run qualify:v3-beta -w packages/research-agent -- --output ../../research-agent-v3-beta-qualification.json

      - name: Benchmark v0.1 and v0.2
        run: |
          node packages/research-agent/scripts/benchmark-v0.1.ts --output research-agent-benchmark-v0.1.json
          node packages/research-agent/scripts/benchmark-v0.2.ts --output research-agent-benchmark-v0.2.json

      - name: Benchmark v0.3
        id: benchmark_v03
        run: node packages/research-agent/scripts/benchmark-v0.3.ts --output research-agent-benchmark-v0.3.json

      - name: Diagnose failed Windows v0.3 transactions
        if: always() && runner.os == 'Windows' && steps.benchmark_v03.outcome == 'failure'
        timeout-minutes: 20
        env:
          RESEARCH_TX_TRACE: "1"
        run: |
          diagnostics_directory=research-agent-v0.3-failure-diagnostics
          mkdir "$diagnostics_directory"
          status=0
          node packages/research-agent/scripts/benchmark-v0.3.ts --output "$diagnostics_directory/research-agent-benchmark-v0.3-trace.json" 2>"$diagnostics_directory/research-agent-v0.3-transaction-trace.log" || status=$?
          node packages/research-agent/scripts/diagnose-windows-file-publish.ts --output "$diagnostics_directory/research-agent-windows-file-publish.json" || status=$?
          test -s "$diagnostics_directory/research-agent-benchmark-v0.3-trace.json"
          test -s "$diagnostics_directory/research-agent-v0.3-transaction-trace.log"
          test -s "$diagnostics_directory/research-agent-windows-file-publish.json"
          exit "$status"

      - name: Upload failed Windows v0.3 transaction diagnostics
        if: always() && runner.os == 'Windows' && steps.benchmark_v03.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-agent-v0.3-failure-diagnostics-windows-${{ github.sha }}
          path: research-agent-v0.3-failure-diagnostics/
          if-no-files-found: error

      - name: Benchmark v0.4 through v2.0
        run: |
          node packages/research-agent/scripts/benchmark-v0.4.ts --output research-agent-benchmark-v0.4.json
          node packages/research-agent/scripts/benchmark-v0.5.ts --output research-agent-benchmark-v0.5.json
          node packages/research-agent/scripts/benchmark-v1.0.ts --output research-agent-benchmark-v1.0.json
          node packages/research-agent/scripts/benchmark-v1.1.ts --output research-agent-benchmark-v1.1.json
          node packages/research-agent/scripts/benchmark-v1.5.ts --output research-agent-benchmark-v1.5.json
          node packages/research-agent/scripts/benchmark-v2.0.ts --output research-agent-benchmark-v2.0.json

      - name: Run Adapter v1 conformance
        run: |
          npm run conform:adapter -w packages/research-agent -- examples/adapters/open-catalog
          npm run conform:adapter -w packages/research-agent -- examples/adapters/repro-runtime
          npm run conform:adapter -w packages/research-agent -- examples/adapters/json-artifact
          npm run conform:adapter -w packages/research-agent -- examples/adapters/community-http-source

      - name: Qualify strong Adapter isolation
        if: runner.os != 'Windows'
        run: node packages/research-agent/scripts/qualify-v1.5-isolation.ts --output research-agent-isolation-v1.5.json

      - name: Qualify Scenario E
        if: runner.os == 'macOS'
        run: node packages/research-agent/scripts/qualify-v2.0-scenario-e.ts --output research-agent-scenario-e-v2.0.json

      - name: Qualify reproducible release
        run: >-
          npm run qualify:release:v3-beta -w packages/research-agent --
          --output ../../research-agent-release-v3.0.0-beta.1.json
          --artifact-directory ../../research-agent-release-artifacts

      - name: Qualify installed Python and R runtimes
        if: runner.os != 'Windows'
        run: npm run qualify:runtimes:v0.3 -w packages/research-agent

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-agent-benchmark-${{ matrix.os }}
          path: |
            research-agent-benchmark-v0.1.json
            research-agent-benchmark-v0.2.json
            research-agent-benchmark-v0.3.json
            research-agent-benchmark-v0.4.json
            research-agent-benchmark-v0.5.json
            research-agent-benchmark-v1.0.json
            research-agent-benchmark-v1.1.json
            research-agent-benchmark-v1.5.json
            research-agent-benchmark-v2.0.json
            research-agent-memory-store-v3.json
            research-agent-memory-retrieval-v3.json
            research-agent-v3-beta-qualification.json
            research-agent-isolation-v1.5.json
            research-agent-scenario-e-v2.0.json
            research-agent-release-v3.0.0-beta.1.json
            research-agent-release-identity.json
          if-no-files-found: warn

      - name: Qualify release package
        run: |
          npm run scan:release -w packages/research-agent-contracts
          npm run scan:release -w packages/research-agent
          npm run test:clean-install -w packages/research-agent
          npm run test:clean-install:latest -w packages/research-agent

      - name: Upload qualified release tarballs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-agent-release-tarballs-${{ matrix.os }}
          path: research-agent-release-artifacts/*.tgz
          if-no-files-found: error

  transaction-qualification:
    name: v3.0.0-beta.1 transaction qualification (macOS)
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build research-agent contracts
        run: npm run build -w packages/research-agent-contracts

      - name: Enforce transaction growth and conflict budgets
        run: >-
          node packages/research-agent/scripts/diagnose-project-transactions.ts
          --counts 125,250,500
          --processes 2
          --repetitions 3
          --watchdog-ms 240000
          --timeout-ms 480000
          --max-elapsed-ms 225000
          --max-conflict-rate 0.001
          --max-growth-ratio 2.6
          --output research-agent-transaction-growth.json
          --trace-output research-agent-transaction-growth.jsonl

      - name: Enforce three consecutive 1,000-write passes
        run: >-
          node packages/research-agent/scripts/diagnose-project-transactions.ts
          --counts 500
          --processes 2
          --repetitions 3
          --watchdog-ms 240000
          --timeout-ms 480000
          --max-elapsed-ms 225000
          --max-conflict-rate 0.001
          --output research-agent-transaction-stability.json
          --trace-output research-agent-transaction-stability.jsonl

      - name: Upload transaction qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-agent-transaction-qualification-macos
          path: |
            research-agent-transaction-growth.json
            research-agent-transaction-growth.jsonl
            research-agent-transaction-stability.json
            research-agent-transaction-stability.jsonl
          if-no-files-found: warn

  public-corpus:
    name: Licensed public-corpus workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install Linux process sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build research-agent contracts
        run: npm run build -w packages/research-agent-contracts

      - name: Run licensed public-corpus workflow
        run: npm run test:public-corpus -w packages/research-agent
