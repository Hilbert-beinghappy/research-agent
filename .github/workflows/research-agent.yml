name: Research Agent

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-core:
    name: v2.0 core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Setup R
        if: runner.os != 'Windows'
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Install Linux process sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build research-agent contracts
        run: npm run build -w packages/research-agent-contracts

      - name: Hydrate Pi model data
        run: npm run hydrate:model-data

      - name: Check package
        run: |
          npm run check -w packages/research-agent-contracts
          npm run check -w packages/research-agent

      - name: Run deterministic tests
        run: |
          npm test -w packages/research-agent-contracts
          npm run test:unit -w packages/research-agent
          npm run test:integration -w packages/research-agent
          npm run test:e2e -w packages/research-agent
          npm run test:compat -w packages/research-agent

      - name: Replay v0.1 through v2.0 release gates
        run: |
          npm run eval -w packages/research-agent -- v0.1
          npm run eval:v0.2 -w packages/research-agent -- v0.2
          npm run eval:v0.3 -w packages/research-agent -- v0.3
          npm run eval:v0.4 -w packages/research-agent -- v0.4
          npm run eval:v0.5 -w packages/research-agent -- v0.5
          npm run eval:v1.0 -w packages/research-agent -- v1.0
          npm run eval:v1.1 -w packages/research-agent -- v1.1
          npm run eval:v1.5 -w packages/research-agent -- v1.5
          npm run eval:v2.0 -w packages/research-agent -- v2.0

      - name: Benchmark v0.1 through v2.0
        run: |
          node packages/research-agent/scripts/benchmark-v0.1.ts --output research-agent-benchmark-v0.1.json
          node packages/research-agent/scripts/benchmark-v0.2.ts --output research-agent-benchmark-v0.2.json
          node packages/research-agent/scripts/benchmark-v0.3.ts --output research-agent-benchmark-v0.3.json
          node packages/research-agent/scripts/benchmark-v0.4.ts --output research-agent-benchmark-v0.4.json
          node packages/research-agent/scripts/benchmark-v0.5.ts --output research-agent-benchmark-v0.5.json
          node packages/research-agent/scripts/benchmark-v1.0.ts --output research-agent-benchmark-v1.0.json
          node packages/research-agent/scripts/benchmark-v1.1.ts --output research-agent-benchmark-v1.1.json
          node packages/research-agent/scripts/benchmark-v1.5.ts --output research-agent-benchmark-v1.5.json
          node packages/research-agent/scripts/benchmark-v2.0.ts --output research-agent-benchmark-v2.0.json

      - name: Run Adapter v1 conformance
        run: |
          npm run conform:adapter -w packages/research-agent -- examples/adapters/open-catalog
          npm run conform:adapter -w packages/research-agent -- examples/adapters/repro-runtime
          npm run conform:adapter -w packages/research-agent -- examples/adapters/json-artifact
          npm run conform:adapter -w packages/research-agent -- examples/adapters/community-http-source

      - name: Qualify strong Adapter isolation
        if: runner.os != 'Windows'
        run: node packages/research-agent/scripts/qualify-v1.5-isolation.ts --output research-agent-isolation-v1.5.json

      - name: Qualify Scenario E
        if: runner.os == 'macOS'
        run: node packages/research-agent/scripts/qualify-v2.0-scenario-e.ts --output research-agent-scenario-e-v2.0.json

      - name: Qualify reproducible release
        run: node packages/research-agent/scripts/qualify-v2.0-release.ts --output research-agent-release-v2.0.json

      - name: Qualify installed Python and R runtimes
        if: runner.os != 'Windows'
        run: npm run qualify:runtimes:v0.3 -w packages/research-agent

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-agent-benchmark-${{ matrix.os }}
          path: |
            research-agent-benchmark-v0.1.json
            research-agent-benchmark-v0.2.json
            research-agent-benchmark-v0.3.json
            research-agent-benchmark-v0.4.json
            research-agent-benchmark-v0.5.json
            research-agent-benchmark-v1.0.json
            research-agent-benchmark-v1.1.json
            research-agent-benchmark-v1.5.json
            research-agent-benchmark-v2.0.json
            research-agent-isolation-v1.5.json
            research-agent-scenario-e-v2.0.json
            research-agent-release-v2.0.json

      - name: Qualify release package
        run: |
          npm run scan:release -w packages/research-agent-contracts
          npm run scan:release -w packages/research-agent
          npm run test:clean-install -w packages/research-agent
          npm run test:clean-install:latest -w packages/research-agent

  public-corpus:
    name: Licensed public-corpus workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install Linux process sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build research-agent contracts
        run: npm run build -w packages/research-agent-contracts

      - name: Run licensed public-corpus workflow
        run: npm run test:public-corpus -w packages/research-agent
